[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tbtrust"
version = "0.1.0"
description = "Trustworthy TB detection under image degradation: robustness + calibrated uncertainty + safe deferral, evaluated leave-one-clinic-out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TB-Trust team" }]

# Core deps that everything actually imports. Kept loose on purpose so a fresh
# `pip install -e .` resolves cleanly on Kaggle, Colab, and local machines.
#
# Deliberately NOT here: albumentations, opencv-python-headless, scikit-image and
# torch-uncertainty were all declared as core dependencies but imported nowhere
# in src/, scripts/ or tests/. The degradation pipeline is numpy+Pillow by design
# (data/degradation.py has to stay importable with no GPU and no compiled CV
# stack), and the calibration/deferral metrics are the local implementations in
# eval/. Requiring four unused packages only made the install slower and more
# fragile. torch-uncertainty is kept as an opt-in extra below.
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=1.0",                 # backbones for the baseline classifier
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",         # ablate_degradation.py's separability classifier
    "matplotlib>=3.7",           # reliability / risk-coverage / gap figures
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pillow>=10.0",
]

[project.optional-dependencies]
# Only needed if you pull the raw datasets from Kaggle via CLI.
data = ["kaggle>=1.6"]
# Third-party uncertainty toolbox. Nothing in this repo imports it: eval/ ships
# its own transparent ECE / MCE / risk-coverage / temperature-scaling / conformal
# implementations, and those are what the figures and tables are built from.
# Install this if you want to cross-check those numbers against a maintained
# reference implementation.
uq = ["torch-uncertainty>=0.10"]
# Dev / CI.
dev = ["pytest>=8.0", "ruff>=0.5", "ipykernel>=6.29", "nbformat>=5.9", "nbclient>=0.9"]

[project.scripts]
tbtrust-train = "tbtrust.train.loop:main"
tbtrust-eval = "tbtrust.eval.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# 100 was declared here from the start but never enforced (there was no CI), and
# 69 pre-existing lines across modules untouched by recent work exceed it. Set the
# limit to one the codebase actually meets so CI gates on it from now on, rather
# than reflowing unrelated files and burying real changes in whitespace churn.
# Tighten back toward 100 in a dedicated formatting pass if you want it.
line-length = 120
target-version = "py310"

# Pin the rule set explicitly. Ruff's *default* selection changes between
# releases, so a CI job installing `ruff>=0.5` would lint against a moving
# target and could start failing on an unrelated commit. This list is the
# default set plus the checks that catch real mistakes in this codebase.
[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes: undefined names, unused imports
    "W",      # pycodestyle warnings
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear: mutable defaults, unused loop vars, ...
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "PERF",   # perflint
]
ignore = [
    # Collapsing an if/else into a ternary loses the inline comments that explain
    # the tensor layouts in data/dataset.py. Clarity wins over brevity there.
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
# physics/figures.py renders labels for humans: "2.4×", "sigma" as σ, "gamma" as γ.
# RUF001 flags these as ambiguous unicode, which is the right call inside
# identifiers and the wrong one inside a matplotlib label.
"src/tbtrust/physics/figures.py" = ["RUF001"]
# Scripts insert the repo's src/ on sys.path before importing tbtrust, so their
# imports legitimately do not sit at the top of the file.
"scripts/*.py" = ["E402"]
"notebooks/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
# Without this, pytest's default "*_test.py" glob also collects
# scripts/smoke_test.py, whose test_* functions take a plain `rng` argument
# (filled in by main()), not a pytest fixture -- that's meant to be run as
# `python scripts/smoke_test.py`, not through pytest. tests/test_smoke.py is
# the pytest-native version of the same checks.
testpaths = ["tests"]
