# Don't forget to surround abstract with double quotes
abstract: "We attempt to reproduce TB-Net (Wong et al., 2022), a self-attention
           convolutional network reported to reach 99.86% accuracy, 100%
           sensitivity and 99.7% specificity for tuberculosis detection from
           chest radiographs, and extend it with a compression and robustness
           study aimed at smartphone deployment in low-resource clinics. Two
           obstacles make a faithful replication impossible from published
           materials: the released TF1 code loads its architecture from a
           checkpoint whose download link is dead, and the public release of
           the training cohort has changed since publication (700 TB images
           today against roughly 3,500 referenced by the original split
           files). We therefore evaluate a capacity-matched 4.2M-parameter
           reconstruction and a 0.27M-parameter compact re-implementation on
           leak-checked splits of the current Rahman cohort, across five seeds
           with bootstrap confidence intervals. The compact model reaches
           98.5 +/- 1.8% accuracy and 96.6 +/- 1.8% sensitivity, short of the
           original headline numbers but consistent with a near-saturated
           task; the larger reconstruction performs worse under the same
           budget. Compression is essentially free at moderate strength: 25%
           unstructured pruning, FP16 and dynamic INT8 preserve accuracy,
           iterative pruning removes the catastrophic sensitivity collapse
           that one-shot 75% pruning produces, and a distilled
           MobileNetV3-Small student shows no advantage over an identically
           trained from-scratch control. Simulated phone-capture distortions
           cut accuracy roughly in half, and external validation on the
           Montgomery and Shenzhen cohorts scores at or below chance for
           reasons we could not resolve; we report this openly rather than
           publish it as a domain-shift finding. We also document every defect
           found during the study, including a train/test leak in our own
           early pipeline whose removal changed the headline numbers by less
           than one point."

